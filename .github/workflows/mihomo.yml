name: Build and Deploy Mihomo Config

env:
  TZ: Asia/Shanghai

on:
  push:
    branches:
      - main
      - test
    paths:
      - "mihomo/**"
      - "*.list"
      - ".github/workflows/mihomo.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH access to server
        env:
          SCP_KEY: ${{ secrets.SCP_KEY }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          if [ -z "$SCP_KEY" ] || [ -z "$HOST" ] || [ -z "$PORT" ]; then
            echo "ERROR: secrets.SCP_KEY, secrets.HOST and secrets.PORT are all required."
            echo "Subscribe URLs and self-hosted proxies are read from your own server instead of GitHub Secrets, so SSH access is mandatory."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SCP_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Fetch subscribe & self-hosted proxy config from server
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          SECRETS_PATH: ${{ secrets.SECRETS_PATH }}
        run: |
          REMOTE_DIR="${SECRETS_PATH:-/www/private/secrets}"
          echo "Fetching config from www@${HOST}:${REMOTE_DIR} ..."

          ssh -o StrictHostKeyChecking=no -p "$PORT" "www@${HOST}" \
            "cat '${REMOTE_DIR}/subscribe.txt' 2>/dev/null || true" > subscribe.txt

          if [ ! -s subscribe.txt ]; then
            echo "ERROR: ${REMOTE_DIR}/subscribe.txt is missing or empty on the server."
            echo "Run 'python3 manage_secrets.py' locally to configure it, then re-run this workflow."
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -p "$PORT" "www@${HOST}" \
            "cat '${REMOTE_DIR}/self-hosted-proxies.yaml' 2>/dev/null || true" > self-hosted-proxies.yaml

      - name: Render release config from template
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import unicodedata
          from dataclasses import dataclass
          from pathlib import Path

          import yaml

          src = Path("mihomo/config.yaml")
          dst = Path("mihomo/config.release.yaml")
          placeholder = "__PROXY_PROVIDERS__"
          self_hosted_placeholder = "__SELF_HOSTED_PROXIES__"
          exclude_filter = "(跳转域名|到期|请先购买|剩余流量|时间|官网|产品|平台|每月刷新|一元机场.ink|管人痴|下次重置剩余)"

          # subscribe.txt accepts either a bare URL (the legacy format) or
          # ``alias|URL``.  The separator is deliberately uncommon in URLs,
          # and splitting only once still allows a literal ``|`` in a URL.
          # Aliases are kept separately from the provider key: the former is
          # what users see in node names, while the latter is a filesystem- and
          # YAML-safe slug.
          ALIAS_PATTERN = re.compile(r"^[\w][\w .-]*\w$|^[\w]$", re.UNICODE)
          URL_SCHEME_PATTERN = re.compile(r"^[a-z][a-z0-9+.-]*://", re.I)
          MAX_ALIAS_LENGTH = 64
          MAX_PROVIDER_NAME_BYTES = 200
          RESERVED_PROVIDER_NAMES = {
              "default", "con", "prn", "aux", "nul",
              *(f"com{i}" for i in range(1, 10)),
              *(f"lpt{i}" for i in range(1, 10)),
          }

          @dataclass(frozen=True)
          class SubscribeEntry:
              alias: str | None
              url: str
              line_no: int

          @dataclass(frozen=True)
          class ProviderSpec:
              name: str
              url: str
              prefix_name: str | None

          def yaml_quote(value: str) -> str:
              # JSON strings are valid YAML scalars and safely quote keys,
              # paths, URLs, and prefixes containing punctuation or Unicode.
              return json.dumps(value, ensure_ascii=False)

          def validate_alias(raw_alias: str, line_no: int) -> str:
              alias = unicodedata.normalize("NFKC", raw_alias.strip())
              if not alias:
                  raise SystemExit(f"subscribe.txt line {line_no}: alias must not be empty")
              if len(alias) > MAX_ALIAS_LENGTH:
                  raise SystemExit(
                      f"subscribe.txt line {line_no}: alias is too long "
                      f"(maximum {MAX_ALIAS_LENGTH} characters)"
                  )
              if not ALIAS_PATTERN.fullmatch(alias):
                  raise SystemExit(
                      f"subscribe.txt line {line_no}: invalid alias {alias!r}; "
                      "use Unicode letters/digits, spaces, '.', '-' or '_' only "
                      "and start/end with a letter, digit or '_'"
                  )
              return alias

          def provider_slug(alias: str, line_no: int) -> str:
              # Dots and whitespace are separators in a path, so normalize
              # them to '-' before retaining Unicode word characters.  The
              # alias validator above excludes path separators and controls.
              slug = re.sub(r"[\s.]+", "-", alias, flags=re.UNICODE)
              slug = re.sub(r"[^\w-]", "-", slug, flags=re.UNICODE)
              slug = re.sub(r"-+", "-", slug).strip("-")
              if not slug:
                  raise SystemExit(f"subscribe.txt line {line_no}: alias has no usable provider name")
              if slug.casefold() in RESERVED_PROVIDER_NAMES:
                  slug = f"{slug}-provider"
              encoded_slug = slug.encode("utf-8")
              if len(encoded_slug) > MAX_PROVIDER_NAME_BYTES:
                  digest = hashlib.sha256(encoded_slug).hexdigest()[:12]
                  suffix = f"-{digest}"
                  byte_budget = MAX_PROVIDER_NAME_BYTES - len(suffix)
                  while len(slug.encode("utf-8")) > byte_budget:
                      slug = slug[:-1]
                  slug = f"{slug}{suffix}"
              return slug

          def parse_subscribe_entries(text: str) -> list[SubscribeEntry]:
              entries: list[SubscribeEntry] = []
              skipped: list[tuple[int, str]] = []
              for line_no, raw in enumerate(text.splitlines(), start=1):
                  line = raw.lstrip("\ufeff").strip()
                  if not line or line.startswith("#"):
                      continue

                  alias: str | None = None
                  url = line
                  # Detect a legacy URL before interpreting `|` as the alias
                  # delimiter, so literal pipes inside URLs stay intact.
                  if not URL_SCHEME_PATTERN.match(line) and "|" in line:
                      raw_alias, url = line.split("|", 1)
                      alias = validate_alias(raw_alias, line_no)
                      url = url.strip()
                      if not url:
                          raise SystemExit(f"subscribe.txt line {line_no}: URL must not be empty")

                  if re.match(r"^https?://", url, re.I):
                      entries.append(SubscribeEntry(alias=alias, url=url, line_no=line_no))
                  elif alias is not None:
                      raise SystemExit(
                          f"subscribe.txt line {line_no}: aliases require an http(s) subscription URL"
                      )
                  else:
                      # Keep the old behavior for unsupported tg:// and other
                      # lines, but do not print their contents (they may carry
                      # credentials/tokens in the URL).
                      skipped.append((line_no, line))

              if skipped:
                  print("Skipped non-http lines (mihomo proxy-providers only support http subscriptions):")
                  for line_no, _ in skipped:
                      print(f"  - line {line_no}")
              return entries

          def provider_name(index: int, total: int) -> str:
              if total == 1:
                  return "airport"
              return f"airport-{index}"

          def build_provider_specs(entries: list[SubscribeEntry]) -> list[ProviderSpec]:
              # Explicit aliases win; bare URLs retain the historical
              # airport/airport-N names. Check final slugs so an alias cannot
              # overwrite another provider in YAML or on disk.
              seen: dict[str, tuple[str, int]] = {}
              specs: list[ProviderSpec] = []
              add_prefix = len(entries) > 1 or any(entry.alias is not None for entry in entries)

              for index, entry in enumerate(entries, start=1):
                  name = (
                      provider_name(index, len(entries))
                      if entry.alias is None
                      else provider_slug(entry.alias, entry.line_no)
                  )
                  collision_key = unicodedata.normalize("NFKC", name).casefold()
                  if collision_key in seen:
                      previous_name, previous_line = seen[collision_key]
                      raise SystemExit(
                          f"subscribe.txt line {entry.line_no}: provider name {name!r} "
                          f"conflicts with {previous_name!r} on line {previous_line}; "
                          "use unique aliases"
                      )
                  seen[collision_key] = (name, entry.line_no)

                  if entry.alias is not None:
                      prefix_name = entry.alias
                  elif add_prefix:
                      prefix_name = name
                  else:
                      prefix_name = None
                  specs.append(ProviderSpec(name=name, url=entry.url, prefix_name=prefix_name))

              return specs

          def render_provider(name: str, url: str, prefix_name: str | None) -> str:
              lines = [
                  f"  {yaml_quote(name)}:",
                  "    type: http",
                  f"    url: {yaml_quote(url)}",
                  f"    path: {yaml_quote(f'./providers/{name}.yaml')}",
                  "    interval: 3600",
                  "    health-check:",
                  "      enable: true",
                  "      url: http://www.gstatic.com/generate_204",
                  "      interval: 300",
              ]
              # Keep the source provider visible after Mihomo merges all
              # provider nodes into the aggregate proxy groups.  Without
              # this, identically named nodes from different subscriptions
              # are indistinguishable in the client UI.  An explicit alias is
              # also useful with one provider, while a lone legacy URL keeps
              # its previous provider and node names for compatibility.
              if prefix_name is not None:
                  additional_prefix = f"[{prefix_name}] "
                  lines.extend([
                      "    override:",
                      f"      additional-prefix: {yaml_quote(additional_prefix)}",
                  ])
              lines.append(f"    exclude-filter: {yaml_quote(exclude_filter)}")
              return "\n".join(lines)

          # Fields that are safe to print in build logs unmasked (structural, not secret).
          SAFE_KEYS = {
              "name", "type", "network", "flow", "tls", "udp", "xudp",
              "client-fingerprint", "packet-encoding", "alpn", "skip-cert-verify",
              "support-x25519mlkem768", "smux", "enabled",
          }

          def mask_secret_values(node) -> None:
              if isinstance(node, dict):
                  for key, value in node.items():
                      if isinstance(value, (dict, list)):
                          mask_secret_values(value)
                      elif key not in SAFE_KEYS and value not in (None, ""):
                          print(f"::add-mask::{value}")
              elif isinstance(node, list):
                  for item in node:
                      mask_secret_values(item)

          def render_self_hosted_proxies() -> str:
              proxies_file = Path("self-hosted-proxies.yaml")
              raw = proxies_file.read_text(encoding="utf-8").strip() if proxies_file.exists() else ""
              if not raw:
                  print("self-hosted-proxies.yaml is empty or missing on the server, skipping self-hosted proxies.")
                  return ""

              try:
                  proxies = yaml.safe_load(raw)
              except yaml.YAMLError as exc:
                  raise SystemExit(f"self-hosted-proxies.yaml is not valid YAML: {exc}")

              if not isinstance(proxies, list) or not proxies:
                  raise SystemExit(
                      "self-hosted-proxies.yaml must be a YAML list of proxy entries, "
                      "e.g. the same items you would put under a config's `proxies:` key."
                  )
              for proxy in proxies:
                  if not isinstance(proxy, dict) or not proxy.get("name") or not proxy.get("type"):
                      raise SystemExit("Each entry in self-hosted-proxies.yaml needs at least `name` and `type`.")

              mask_secret_values(proxies)

              proxies_yaml = yaml.dump(
                  proxies, allow_unicode=True, sort_keys=False, default_flow_style=False
              )
              # Clash Verge Rev 2.5.2 filters Inline providers out of its UI
              # model. Top-level entries remain testable and need no companion
              # provider file on the client.
              indented_proxies = "\n".join(
                  f"  {line}" if line else line for line in proxies_yaml.splitlines()
              )
              return indented_proxies

          subscribe = Path("subscribe.txt").read_text(encoding="utf-8")
          entries = parse_subscribe_entries(subscribe)
          if not entries:
              raise SystemExit("No valid http(s) subscribe URL found in subscribe.txt fetched from the server.")

          for entry in entries:
              print(f"::add-mask::{entry.url}")

          # Prefix explicit aliases even when there is only one provider. A
          # lone bare URL keeps the old provider and node names.
          provider_specs = build_provider_specs(entries)
          providers = [
              render_provider(spec.name, spec.url, spec.prefix_name)
              for spec in provider_specs
          ]
          providers_block = "\n".join(providers)

          self_hosted_block = render_self_hosted_proxies()

          content = src.read_text(encoding="utf-8")
          if placeholder not in content:
              raise SystemExit(f"placeholder {placeholder} not found in {src}")
          if self_hosted_placeholder not in content:
              raise SystemExit(f"placeholder {self_hosted_placeholder} not found in {src}")

          content = content.replace(placeholder, providers_block)
          content = content.replace(self_hosted_placeholder, self_hosted_block)

          try:
              rendered = yaml.safe_load(content)
          except yaml.YAMLError as exc:
              raise SystemExit(f"Rendered Mihomo configuration is not valid YAML: {exc}")
          if not isinstance(rendered, dict) or not isinstance(rendered.get("proxies"), list):
              raise SystemExit("Rendered Mihomo configuration must contain a top-level proxies list.")

          dst.write_text(content, encoding="utf-8")
          print(
              f"Rendered {dst} with {len(provider_specs)} proxy-provider(s): "
              f"{', '.join(spec.name for spec in provider_specs)}"
          )
          if self_hosted_block:
              print("Included self-hosted top-level proxies.")
          PY

      - name: Package config
        run: |
          mkdir -p config
          cp mihomo/config.release.yaml config/clash.yaml
          tar -zcf config.tar.gz -C config .

      - name: Deploy config via SCP
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          scp -o StrictHostKeyChecking=no -P "$PORT" -r ./config.tar.gz "www@${HOST}:/www/private/"
          ssh -o StrictHostKeyChecking=no -p "$PORT" "www@${HOST}" "tar -zxf /www/private/config.tar.gz -C /www/private/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-config
          path: config.tar.gz
